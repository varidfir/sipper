<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="45%" stop-color="#16a34a" />
      <stop offset="70%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Shield Border -->
  <path d="M 100,10 L 180,45 V 135 C 180,185 140,215 100,230 C 60,215 20,185 20,135 V 45 Z" 
        fill="url(#goldGrad)" filter="url(#shadow)" stroke="#a16207" stroke-width="2"/>

  <!-- Inner Shield -->
  <path d="M 100,18 L 172,49 V 132 C 172,178 136,206 100,220 C 64,206 28,178 28,132 V 49 Z" 
        fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="2"/>

  <!-- Mountain Peak -->
  <polygon points="100,85 145,150 55,150" fill="#0f172a" opacity="0.75"/>
  <polygon points="100,85 125,150 100,150" fill="#1e293b" opacity="0.6"/>
  <polygon points="100,85 110,110 100,105 90,110" fill="#ffffff" opacity="0.9"/>

  <!-- Yellow Star -->
  <polygon points="100,30 105,42 118,43 108,51 112,63 100,55 88,63 92,51 82,43 95,42" fill="url(#goldGrad)" stroke="#a16207" stroke-width="0.8"/>

  <!-- Water Waves / Base Stripes -->
  <path d="M 40,165 Q 70,155 100,165 T 160,165 V 175 Q 130,165 100,175 T 40,175 Z" fill="#38bdf8"/>
  <path d="M 45,180 Q 72,172 100,180 T 155,180 V 188 Q 128,180 100,188 T 45,188 Z" fill="#0284c7"/>

  <!-- Paddy & Cotton Branches (Left & Right framing) -->
  <path d="M 38,135 C 34,105 48,70 82,55" fill="none" stroke="#facc15" stroke-width="4" stroke-linecap="round"/>
  <path d="M 162,135 C 166,105 152,70 118,55" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <!-- Center Red-White Ribbon / Monument Symbol -->
  <rect x="95" y="115" width="10" height="35" rx="2" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
</svg>
